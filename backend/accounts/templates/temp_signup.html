<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ثبت نام</title>
</head>
<body style="font-family: Tahoma; padding: 50px; text-align: center;">
    <h2>ثبت نام کاربر جدید</h2>
    
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" style="max-width: 300px; margin: 0 auto; text-align: right;">
        {% csrf_token %}
        
        <label>شماره موبایل:</label><br>
        <input type="text" name="phone_number" required style="margin: 5px 0 15px; padding: 8px; width: 100%;">
        
        <label>نام:</label><br>
        <input type="text" name="first_name" required style="margin: 5px 0 15px; padding: 8px; width: 100%;">
        
        <label>نام خانوادگی:</label><br>
        <input type="text" name="last_name" required style="margin: 5px 0 15px; padding: 8px; width: 100%;">
        
        <label>رمز عبور:</label><br>
        <input type="password" name="password" required style="margin: 5px 0 15px; padding: 8px; width: 100%;">
        
        <button type="submit" style="padding: 10px 20px; width: 100%; background: #4bb4e6; color: white; border: none; cursor: pointer;">ثبت نام</button>
    </form>
    <br>
    <a href="{% url 'accounts:temp_password_login' %}">ورود با کد</a>
    <a href="{% url 'accounts:temp_password_login' %}">ورود با رمز عبور</a> | 
</body>
</html>
