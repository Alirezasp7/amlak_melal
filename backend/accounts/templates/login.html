<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 420px;
            margin: 60px auto;
            background: #eaf6ff;
            color: #0c4a6e;
        }
        h1 {
            text-align: center;
            color: #075985;
        }
        form {
            background: #ffffff;
            border: 1px solid #bae6fd;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(14, 116, 178, 0.12);
        }
        form p { display: flex; flex-direction: column; margin-bottom: 14px; }
        label { font-weight: bold; margin-bottom: 4px; color: #0369a1; }
        input {
            padding: 8px;
            border: 1px solid #7dd3fc;
            border-radius: 4px;
            background: #f0f9ff;
            color: #0c4a6e;
        }
        input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
        }
        button {
            width: 100%;
            padding: 10px;
            background: #38bdf8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #0ea5e9; }
        .errorlist { color: #c00; list-style: none; padding: 0; margin: 4px 0; }
        p.signup-link { text-align: center; margin-top: 16px; }
        p.signup-link a { color: #0284c7; text-decoration: none; }
        p.signup-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Log In</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>
    <p class="signup-link">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
</body>
</html>
