<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ثبت درخواست ملکی</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #eaf6ff;
            color: #0c4a6e;
            margin: 0;
            padding: 60px 20px;
        }
        h1 {
            text-align: center;
            color: #075985;
            margin-bottom: 32px;
        }
        form {
            max-width: 420px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #bae6fd;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(14, 116, 178, 0.12);
        }
        form p { display: flex; flex-direction: column; margin-bottom: 18px; }
        label { font-weight: bold; margin-bottom: 6px; color: #0369a1; }
        select.form-select {
            padding: 10px;
            border: 1px solid #7dd3fc;
            border-radius: 4px;
            background: #f0f9ff;
            color: #0c4a6e;
            font-family: inherit;
            font-size: 15px;
        }
        select.form-select:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
        }
        button {
            width: 100%;
            padding: 10px;
            background: #38bdf8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #0ea5e9; }
        .errorlist { color: #c00; list-style: none; padding: 0; margin: 4px 0; }
    </style>
</head>
<body>
    <h1>ثبت درخواست ملکی</h1>
    <form method="post" novalidate id="request-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">ادامه</button>
    </form>

    <script>
        // Map of user type -> list of property type values to exclude,
        // passed from the view (PropertyRequest.EXCLUDED_PROPERTY_TYPES).
        const excludedMap = {
            {% for user_type, excluded_list in excluded_map.items %}
            "{{ user_type }}": [{% for val in excluded_list %}"{{ val }}",{% endfor %}],
            {% endfor %}
        };

        const requestTypeSelect = document.getElementById("id_request_type");
        const propertyTypeSelect = document.getElementById("id_property_type");

        // Keep a copy of every original <option> so we can restore them
        // when the excluded set changes.
        const allPropertyOptions = Array.from(propertyTypeSelect.options);

        function refreshPropertyOptions() {
            const excluded = excludedMap[requestTypeSelect.value] || [];
            const currentValue = propertyTypeSelect.value;

            propertyTypeSelect.innerHTML = "";
            allPropertyOptions.forEach((opt) => {
                if (!excluded.includes(opt.value)) {
                    propertyTypeSelect.appendChild(opt.cloneNode(true));
                }
            });

            // Keep the previous selection if it's still valid, otherwise
            // fall back to the first available option.
            const stillValid = Array.from(propertyTypeSelect.options)
                .some((opt) => opt.value === currentValue);
            if (stillValid) {
                propertyTypeSelect.value = currentValue;
            }
        }

        requestTypeSelect.addEventListener("change", refreshPropertyOptions);
        refreshPropertyOptions(); // run once on page load too
    </script>
</body>
</html>
