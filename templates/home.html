<!DOCTYPE html>
<html>
<head>
    <title>Real Estate</title>
</head>
<body>
    {% if user.is_authenticated %}
        <span>Welcome, {{ user.first_name }}!</span>
        <a href="{% url 'logout' %}">Log out</a>
    {% else %}
        <a href="{% url 'signup' %}">Sign up</a>
        <a href="{% url 'login' %}">Log in</a>
    {% endif %}
</body>
</html>
